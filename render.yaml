services:
  - type: web
    name: payflow-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: payflow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: payflow-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: payflow-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: payflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: payflow-postgres
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: payflow-postgres
    databaseName: payflow_db
    user: payflow_user
    plan: free
    region: oregon
