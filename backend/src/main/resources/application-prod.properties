# PayFlow Production Profile (Render / Cloud Deployment)

server.port=${PORT:8080}
server.servlet.context-path=/

spring.application.name=payflow-backend

# Production PostgreSQL Database Connection
# Supports standard JDBC connection URL or parsed DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payflow_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:payflow_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:payflow_secret}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for Render Free / Starter Tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Production CORS Configuration (Allows Vercel domains, custom domains, and local preview)
payflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:5173,http://localhost:3000}

# JWT Secret & Expiration
payflow.jwt.secret=${JWT_SECRET:${PAYFLOW_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
payflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging configuration (Never leak sensitive headers or credentials)
logging.level.root=INFO
logging.level.com.payflow=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
