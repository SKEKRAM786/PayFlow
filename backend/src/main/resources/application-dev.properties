# PayFlow Local Development Profile (Embedded DB - Zero setup required)

server.port=${PORT:8080}
server.servlet.context-path=/

spring.application.name=payflow-backend

# Embedded H2 in PostgreSQL Mode (persists to a local file in backend/data/payflow_dev)
spring.datasource.url=jdbc:h2:file:./data/payflow_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA & Hibernate in PostgreSQL Compatibility Mode
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for local H2 mode
spring.flyway.enabled=false

# Actuator & Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Configuration for local React frontend
payflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# JWT Security Configuration
payflow.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
payflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
