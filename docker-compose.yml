services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payflow_db}
      POSTGRES_USER: ${DB_USER:-payflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payflow_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payflow_user} -d ${DB_NAME:-payflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-payflow_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-payflow_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-payflow_secret}
      PAYFLOW_JWT_SECRET: ${PAYFLOW_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - payflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:8080"
    networks:
      - payflow-network

volumes:
  postgres_data:
    driver: local

networks:
  payflow-network:
    driver: bridge
